<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="waxGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2B134" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2B134" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background base grid lines representing pitch markers & wax intersections -->
  <path d="M0,0 L120,120 M120,0 L0,120" stroke="#F2B134" stroke-width="0.75" stroke-opacity="0.12" stroke-dasharray="2 3"/>
  <rect x="20" y="20" width="80" height="80" rx="16" fill="none" stroke="#0B3D2E" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Concentric wax rhombuses -->
  <polygon points="60,10 110,60 60,110 10,60" fill="none" stroke="#F2B134" stroke-width="1.2" stroke-opacity="0.18"/>
  <polygon points="60,25 95,60 60,95 25,60" fill="none" stroke="#D6402B" stroke-width="1" stroke-opacity="0.15"/>
  <polygon points="60,40 80,60 60,80 40,60" fill="none" stroke="#FAF6EE" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Football pitch center circle + sunburst motif -->
  <circle cx="60" cy="60" r="14" fill="none" stroke="#F2B134" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="60" cy="60" r="4" fill="#F2B134" fill-opacity="0.25"/>
  <circle cx="0" cy="0" r="12" fill="none" stroke="#F2B134" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="120" cy="0" r="12" fill="none" stroke="#F2B134" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="0" cy="120" r="12" fill="none" stroke="#F2B134" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="120" cy="120" r="12" fill="none" stroke="#F2B134" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Decorative radiating dashed rays -->
  <path d="M60,0 L60,18 M60,102 L60,120 M0,60 L18,60 M102,60 L120,60" stroke="#D6402B" stroke-width="1" stroke-opacity="0.2"/>
</svg>
