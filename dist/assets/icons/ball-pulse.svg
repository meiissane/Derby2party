<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Concentric heartbeat wave circles -->
  <circle cx="24" cy="24" r="22" stroke="#F2B134" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3">
    <animate attributeName="r" values="18;23;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="24" r="17" stroke="#D6402B" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Central Ball -->
  <circle cx="24" cy="24" r="14" fill="#0B3D2E" stroke="#F2B134" stroke-width="2"/>
  <!-- Ball facets / pentagon -->
  <polygon points="24,15 31,20 28,28 20,28 17,20" fill="#F2B134" fill-opacity="0.3" stroke="#F2B134" stroke-width="1.2"/>
  <line x1="24" y1="15" x2="24" y2="10" stroke="#FAF6EE" stroke-width="1.2"/>
  <line x1="31" y1="20" x2="36" y2="17" stroke="#FAF6EE" stroke-width="1.2"/>
  <line x1="28" y1="28" x2="33" y2="33" stroke="#FAF6EE" stroke-width="1.2"/>
  <line x1="20" y1="28" x2="15" y2="33" stroke="#FAF6EE" stroke-width="1.2"/>
  <line x1="17" y1="20" x2="12" y2="17" stroke="#FAF6EE" stroke-width="1.2"/>
  <!-- Heartbeat ECG line through center -->
  <path d="M6 24h6l2 -4l3 8l3 -6l2 2h8" stroke="#F2B134" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
