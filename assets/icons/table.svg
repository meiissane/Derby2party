<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shared table perspective -->
  <ellipse cx="24" cy="22" rx="20" ry="10" fill="#0B3D2E" stroke="#F2B134" stroke-width="2"/>
  <ellipse cx="24" cy="22" rx="16" ry="7" fill="none" stroke="#F2B134" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <!-- Table legs -->
  <line x1="8" y1="26" x2="8" y2="40" stroke="#F2B134" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="26" x2="40" y2="40" stroke="#F2B134" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="31" x2="24" y2="44" stroke="#F2B134" stroke-width="2" stroke-linecap="round"/>
  <!-- Scarf draped on the chair: "La place t'attend" -->
  <path d="M14 16 C 14 10, 18 8, 24 8 C 30 8, 34 10, 34 16" fill="none" stroke="#D6402B" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 16 L 14 26" stroke="#D6402B" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 16 L 18 24" stroke="#F2B134" stroke-width="2" stroke-linecap="round"/>
  <!-- Golden sparkles above -->
  <circle cx="24" cy="4" r="1.5" fill="#F2B134"/>
  <circle cx="12" cy="7" r="1" fill="#FAF6EE"/>
  <circle cx="36" cy="7" r="1" fill="#FAF6EE"/>
</svg>
